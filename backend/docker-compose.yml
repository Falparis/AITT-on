# Docker Compose configuration with persistent SSL certificate storage
services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    expose:
      - "4000"
    environment:
      - VIRTUAL_HOST=${BACKEND_DOMAIN}
      - VIRTUAL_PORT=4000
      - VIRTUAL_CLIENT_MAX_BODY_SIZE=50m
      - LETSENCRYPT_HOST=${BACKEND_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - ./uploads:/data
    depends_on:
      - nginx-proxy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VIRTUAL_HOST=${FRONTEND_DOMAIN}
      - LETSENCRYPT_HOST=${FRONTEND_DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    depends_on:
      - nginx-proxy

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    environment:
      # GLOBAL upload limit. nginx defaults to 1m, which rejects document
      # uploads at the proxy — before the request ever reaches Express, so the
      # 413 comes back with no CORS headers and the browser reports it as a
      # bogus "No Access-Control-Allow-Origin" error.
      # Set here rather than only in a per-vhost vhost.d/<domain> file: that
      # file has to be named after the live VIRTUAL_HOST, so it silently stops
      # applying the moment the domain changes (which is exactly what happened
      # when the API moved off aitt-backend.duckdns.org).
      - CLIENT_MAX_BODY_SIZE=50m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    labels:
      - "com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy"

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: acme-companion
    restart: unless-stopped
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - DEFAULT_EMAIL=${LETSENCRYPT_EMAIL}
      - DEBUG=0
      - ACME_PREFERRED_CHAIN=ISRG Root X1
    volumes:
      - ./certs:/etc/nginx/certs:rw
      - ./vhost.d:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy